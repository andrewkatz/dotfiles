""",
    """
    cat > mise.local.toml <<EOF
# Auto-generated for worktree: $next_num
[env]
PORT = {{ branch | hash_port }}
WEB_PORT = {{ branch | hash_port }}
DATABASE_PORT = {{ ("DATABASE_PORT" ~ branch) | hash_port }}
REDIS_PORT = {{ ("REDIS_PORT" ~ branch) | hash_port }}
MAILHOG_SMTP_PORT = {{ ("MAILHOG_SMTP_PORT" ~ branch) | hash_port }}
MAILHOG_HTTP_PORT = {{ ("MAILHOG_HTTP_PORT" ~ branch) | hash_port }}
AWS_REGION = "us-west-2"
AWS_DEFAULT_PROFILE = "p"
SNOWFLAKE_DEV_SUFFIX = "ANDREW_{{ branch | sanitize_db }}"
EOF

    awk '/^[[:space:]]*KAMAL_SSH_PROXY_USER[[:space:]]*=/{ print; exit }' "{{ primary_worktree_path }}/mise.local.toml" >> mise.local.toml 2>/dev/null || true

mise trust
""",
    """
    cat > mise.local.toml <<EOF
# Auto-generated for worktree: $next_num
[env]
PORT = {{ branch | hash_port }}
WEB_PORT = {{ branch | hash_port }}
COMPOSE_PROJECT_NAME = "via-platform"
DATABASE_PORT = 24662
REDIS_PORT = 52944
MAILHOG_SMTP_PORT = 53865
MAILHOG_HTTP_PORT = 26053
PLATFORM_DATABASE_NAME = "app_dev_{{ branch | sanitize_db }}"
CORE_DATABASE_NAME = "core_dev_{{ branch | sanitize_db }}"
PLATFORM_TEST_DATABASE_NAME = "app_test_{{ branch | sanitize_db }}"
CORE_TEST_DATABASE_NAME = "core_test_{{ branch | sanitize_db }}"
REDIS_NAMESPACE = "via:{{ branch | sanitize_db }}"
AWS_REGION = "us-west-2"
AWS_DEFAULT_PROFILE = "p"
SNOWFLAKE_DEV_SUFFIX = "ANDREW_{{ branch | sanitize_db }}"
EOF

    awk '/^[[:space:]]*KAMAL_SSH_PROXY_USER[[:space:]]*=/{ print; exit }' "{{ primary_worktree_path }}/mise.local.toml" >> mise.local.toml 2>/dev/null || true

mise trust
""",
    "mise exec -- docker-compose up -d --no-recreate ; sleep 2",
    """
    primary_mise="{{ primary_worktree_path }}/mise.local.toml"

    primary_env_value() {
      if [ -f "$primary_mise" ]; then
        awk -F= -v key="$1" '
          $1 ~ "^[[:space:]]*" key "[[:space:]]*$" {
            value = $0
            sub("^[^=]*=", "", value)
            sub("^[[:space:]]*", "", value)
            sub("[[:space:]]*$", "", value)
            print value
            exit
          }
        ' "$primary_mise"
      fi
    }

    compose_project_name=$(primary_env_value COMPOSE_PROJECT_NAME)
    database_port=$(primary_env_value DATABASE_PORT)
    redis_port=$(primary_env_value REDIS_PORT)
    mailhog_smtp_port=$(primary_env_value MAILHOG_SMTP_PORT)
    mailhog_http_port=$(primary_env_value MAILHOG_HTTP_PORT)

    compose_project_name=${compose_project_name:-'"via-platform"'}
    database_port=${database_port:-24662}
    redis_port=${redis_port:-52944}
    mailhog_smtp_port=${mailhog_smtp_port:-53865}
    mailhog_http_port=${mailhog_http_port:-26053}

    cat > mise.local.toml <<EOF
# Auto-generated for worktree: $next_num
[env]
PORT = {{ branch | hash_port }}
WEB_PORT = {{ branch | hash_port }}
COMPOSE_PROJECT_NAME = $compose_project_name
DATABASE_PORT = $database_port
REDIS_PORT = $redis_port
MAILHOG_SMTP_PORT = $mailhog_smtp_port
MAILHOG_HTTP_PORT = $mailhog_http_port
PLATFORM_DATABASE_NAME = "app_dev_{{ branch | sanitize_db }}"
CORE_DATABASE_NAME = "core_dev_{{ branch | sanitize_db }}"
PLATFORM_TEST_DATABASE_NAME = "app_test_{{ branch | sanitize_db }}"
CORE_TEST_DATABASE_NAME = "core_test_{{ branch | sanitize_db }}"
REDIS_NAMESPACE = "via:{{ branch | sanitize_db }}"
AWS_REGION = "us-west-2"
AWS_DEFAULT_PROFILE = "p"
SNOWFLAKE_DEV_SUFFIX = "ANDREW_{{ branch | sanitize_db }}"
EOF

    awk '/^[[:space:]]*KAMAL_SSH_PROXY_USER[[:space:]]*=/{ print; exit }' "$primary_mise" >> mise.local.toml 2>/dev/null || true

mise trust
""",
    """
    primary_mise="{{ primary_worktree_path }}/mise.local.toml"

    # Shared dev services (mysql/redis/mailhog) run as ONE docker-compose stack
    # named via-platform and reused by every worktree. These host ports are fixed
    # constants that match that stack's published ports. They are intentionally
    # NOT sourced from the primary worktree's mise.local.toml: a one-off override
    # there (e.g. pointing the primary at a local Homebrew MySQL on 3306) would
    # otherwise leak into every new worktree and point it at the wrong database
    # server. Per-worktree isolation comes from the database names + redis
    # namespace below, not from ports.
    cat > mise.local.toml <<EOF
# Auto-generated for worktree: $next_num
[env]
PORT = {{ branch | hash_port }}
WEB_PORT = {{ branch | hash_port }}
COMPOSE_PROJECT_NAME = "via-platform"
DATABASE_PORT = 24662
REDIS_PORT = 52944
MAILHOG_SMTP_PORT = 53865
MAILHOG_HTTP_PORT = 26053
PLATFORM_DATABASE_NAME = "app_dev_{{ branch | sanitize_db }}"
CORE_DATABASE_NAME = "core_dev_{{ branch | sanitize_db }}"
PLATFORM_TEST_DATABASE_NAME = "app_test_{{ branch | sanitize_db }}"
CORE_TEST_DATABASE_NAME = "core_test_{{ branch | sanitize_db }}"
REDIS_NAMESPACE = "via:{{ branch | sanitize_db }}"
AWS_REGION = "us-west-2"
AWS_DEFAULT_PROFILE = "p"
SNOWFLAKE_DEV_SUFFIX = "ANDREW_{{ branch | sanitize_db }}"
EOF

    # KAMAL_SSH_PROXY_USER is genuinely per-developer, so inherit it from the
    # primary worktree when present.
    awk '/^[[:space:]]*KAMAL_SSH_PROXY_USER[[:space:]]*=/{ print; exit }' "$primary_mise" >> mise.local.toml 2>/dev/null || true

mise trust
""",
    """
    primary_mise="{{ primary_worktree_path }}/mise.local.toml"

    # Each worktree runs its own docker-compose stack. The compose project name
    # and host ports are derived from the branch, so database and Redis cleanup
    # cannot affect another worktree. Database names use the database.yml
    # defaults because the container and its volumes are the isolation boundary.
    BASE_PORT={{ branch | hash_port }}
    cat > mise.local.toml <<EOF
# Auto-generated by wt for branch: {{ branch }}
[env]
PORT = $BASE_PORT
WEB_PORT = $BASE_PORT
COMPOSE_PROJECT_NAME = "via_{{ branch | sanitize_db }}"
DATABASE_PORT = $((BASE_PORT + 1))
REDIS_PORT = $((BASE_PORT + 2))
MAILHOG_SMTP_PORT = $((BASE_PORT + 3))
MAILHOG_HTTP_PORT = $((BASE_PORT + 4))
REDIS_NAMESPACE = "via:local"
AWS_REGION = "us-west-2"
AWS_DEFAULT_PROFILE = "p"
SNOWFLAKE_DEV_SUFFIX = "ANDREW_{{ branch | sanitize_db }}"
EOF

    # KAMAL_SSH_PROXY_USER is genuinely per-developer, so inherit it from the
    # primary worktree when present.
    awk '/^[[:space:]]*KAMAL_SSH_PROXY_USER[[:space:]]*=/{ print; exit }' "$primary_mise" >> mise.local.toml 2>/dev/null || true

mise trust
""",
    "mise exec -- bin/up",
    """
    primary_mise="{{ primary_worktree_path }}/mise.local.toml"

    # Each worktree runs its own docker-compose stack. The compose project name
    # and host ports are derived from the branch, so database and Redis cleanup
    # cannot affect another worktree. Database names use the database.yml
    # defaults because the container and its volumes are the isolation boundary.
    BASE_PORT={{ branch | hash_port }}
    cat > mise.local.toml <<EOF
# Auto-generated by wt for branch: {{ branch }}
[env]
PORT = $BASE_PORT
WEB_PORT = $BASE_PORT
COMPOSE_PROJECT_NAME = "via_{{ branch | sanitize_db }}"
DATABASE_PORT = $((BASE_PORT + 1))
REDIS_PORT = $((BASE_PORT + 2))
MAILHOG_SMTP_PORT = $((BASE_PORT + 3))
MAILHOG_HTTP_PORT = $((BASE_PORT + 4))
REDIS_NAMESPACE = "via:local"
AWS_REGION = "us-west-2"
AWS_DEFAULT_PROFILE = "p"
{% if base != "origin/beta" and base != "beta" %}
SNOWFLAKE_DEV_SUFFIX = "ANDREW_{{ branch | sanitize_db }}"
{% endif %}
EOF

    # KAMAL_SSH_PROXY_USER is genuinely per-developer, so inherit it from the
    # primary worktree when present.
    awk '/^[[:space:]]*KAMAL_SSH_PROXY_USER[[:space:]]*=/{ print; exit }' "$primary_mise" >> mise.local.toml 2>/dev/null || true

mise trust
""",
    """
    primary_mise="{{ primary_worktree_path }}/mise.local.toml"

    # Each worktree runs its own docker-compose stack (mysql/redis/mailhog):
    # the compose project name and host ports are derived from the branch, so
    # worktrees are fully isolated and `wt remove` reclaims everything with a
    # single `docker-compose down -v`. Ports are the worktree's hash port plus
    # small offsets — deterministic across restarts. Database names stay the
    # plain database.yml defaults because the container itself is the isolation
    # boundary. Dev runs offline by default (see
    # docs/architecture/dev-offline-mode.md); add DEV_CONNECTED=1 and a
    # SNOWFLAKE_DEV_SUFFIX here only when a branch needs the real services.
    BASE_PORT={{ branch | hash_port }}
    cat > mise.local.toml <<EOF
# Auto-generated by wt for branch: {{ branch }}
[env]
PORT = $BASE_PORT
WEB_PORT = $BASE_PORT
COMPOSE_PROJECT_NAME = "via_{{ branch | sanitize_db }}"
DATABASE_PORT = $((BASE_PORT + 1))
REDIS_PORT = $((BASE_PORT + 2))
MAILHOG_SMTP_PORT = $((BASE_PORT + 3))
MAILHOG_HTTP_PORT = $((BASE_PORT + 4))
PLATFORM_DATABASE_NAME = "app_development"
CORE_DATABASE_NAME = "core_development"
PLATFORM_TEST_DATABASE_NAME = "app_test"
CORE_TEST_DATABASE_NAME = "core_test"
REDIS_NAMESPACE = "via:local"
AWS_REGION = "us-west-2"
AWS_DEFAULT_PROFILE = "p"
EOF

    # KAMAL_SSH_PROXY_USER is genuinely per-developer, so inherit it from the
    # primary worktree when present.
    awk '/^[[:space:]]*KAMAL_SSH_PROXY_USER[[:space:]]*=/{ print; exit }' "$primary_mise" >> mise.local.toml 2>/dev/null || true

mise trust
""",
]

